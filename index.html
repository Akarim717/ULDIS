<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ULDIS | UNITEN Leadership Development Intelligence</title><style>
:root{--bg:#f4f6fa;--ink:#14243b;--muted:#657589;--line:#e0e6ef;--navy:#102945;--blue:#2572c8;--cyan:#00a9bd;--green:#12866e;--amber:#d58c26;--card:#fff;--red:#b45052}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:14px}button,input,select,textarea{font:inherit}button{cursor:pointer}header{background:var(--navy);color:white;padding:16px 26px;display:flex;align-items:center;justify-content:space-between;gap:14px}.brand{display:flex;align-items:center;gap:13px}.mark{width:43px;height:43px;display:grid;place-items:center;background:linear-gradient(135deg,#19c9d7,#2867c8);border-radius:12px;color:white;font-size:21px;font-weight:900;letter-spacing:-1px}.brand strong{font-size:17px}.brand small{display:block;color:#bfd1e5;margin-top:3px}.topright{display:flex;align-items:center;gap:10px}.topright select{max-width:195px;border-color:#647d9b;background:#25425e;color:white}select,input,textarea{padding:10px 12px;border:1px solid #cdd8e4;border-radius:9px;background:white;color:var(--ink)}.frame{display:flex;min-height:calc(100vh - 79px)}aside{width:237px;background:white;border-right:1px solid var(--line);padding:18px 11px;flex-shrink:0}aside .group{font-size:10px;font-weight:800;letter-spacing:1.6px;color:#8b9aab;margin:14px 12px 8px}aside button{display:flex;width:100%;text-align:left;align-items:center;gap:11px;padding:12px;border:0;background:transparent;border-radius:9px;color:#4e6074;font-weight:600}aside button:hover,aside button.active{background:#edf5fe;color:#1b5fa7}aside button span{width:20px;text-align:center;font-size:16px}main{padding:28px 32px;max-width:1510px;width:100%;margin:0 auto}.eyebrow{text-transform:uppercase;letter-spacing:1.5px;font-weight:800;font-size:10px;color:var(--blue)}h1{margin:7px 0 5px;font-size:28px;letter-spacing:-.8px}h2{font-size:18px;margin:0 0 14px}h3{margin:0 0 10px;font-size:15px}p{line-height:1.55}.sub{color:var(--muted);margin:0 0 25px}.tophead{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:18px}.tophead .sub{margin:4px 0 0}.grid{display:grid;gap:15px}.cols4{grid-template-columns:repeat(4,minmax(0,1fr))}.cols3{grid-template-columns:repeat(3,minmax(0,1fr))}.cols2{grid-template-columns:repeat(2,minmax(0,1fr))}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;min-width:0;box-shadow:0 2px 9px #0e2f4b05}.metric{font-size:31px;font-weight:800;letter-spacing:-.8px;margin:12px 0 5px}.muted{color:var(--muted)}.tiny{font-size:11px;color:var(--muted)}.pill{display:inline-block;padding:5px 9px;border-radius:30px;background:#e9f3fe;color:#1c67aa;font-weight:700;font-size:11px}.good{color:var(--green)}.warn{color:#a66a10}.bad{color:var(--red)}.btn{background:var(--blue);border:1px solid var(--blue);border-radius:9px;padding:10px 15px;color:white;font-weight:750}.btn.secondary{color:var(--blue);background:white}.btn.ghost{color:#55677a;background:white;border-color:var(--line)}.btn.small{padding:7px 11px;font-size:12px}.btn:disabled{opacity:.45;cursor:not-allowed}.flex{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.between{display:flex;justify-content:space-between;gap:12px;align-items:center}.space{height:18px}.bar{height:8px;border-radius:20px;background:#e9eff6;overflow:hidden;margin-top:8px}.fill{height:100%;background:linear-gradient(90deg,#1fa6bc,#2169bd);border-radius:20px}.barrow{margin:15px 0}.barrow .between{font-size:12px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:12px}th{text-transform:uppercase;font-size:10px;color:#75869a;letter-spacing:.7px;text-align:left;background:#f8fafd}td,th{border-bottom:1px solid var(--line);padding:12px 10px;vertical-align:top}tr:last-child td{border-bottom:0}.role{font-size:12px;color:var(--muted)}.notice{background:#eaf4fc;border-left:3px solid #3292cf;padding:12px 16px;color:#315c7d;border-radius:4px;margin:12px 0 22px}.detail{background:#f8fafd;border:1px solid var(--line);border-radius:10px;padding:14px}.tag{font-size:10px;background:#eef2f6;color:#53677f;border-radius:6px;padding:4px 7px;display:inline-block;margin:2px}.risk{background:#fff2e0;color:#986011}.ok{background:#e3f5ed;color:#0a7d60}.round{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:#def2f7;color:#126d9e;font-weight:900;font-size:19px}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.field{display:flex;flex-direction:column;gap:6px}.field label{font-size:12px;font-weight:750;color:#536780}.field.full{grid-column:1/-1}.field textarea{min-height:94px;resize:vertical}.empty{padding:40px;text-align:center;color:var(--muted)}.hide{display:none!important}.tabstrip{display:flex;gap:8px;margin:0 0 18px;flex-wrap:wrap}.tabstrip button{border:1px solid var(--line);border-radius:9px;padding:9px 13px;background:white;color:#52647b}.tabstrip button.active{background:#e5f1fe;color:#13589f;border-color:#a8c8ec}.timeline{position:relative;padding-left:24px;margin:15px 0}.timeline:before{content:"";position:absolute;left:6px;top:0;bottom:0;width:2px;background:#dbe8f5}.timeline .event{position:relative;padding:0 0 17px}.timeline .event:before{content:"";position:absolute;left:-23px;top:4px;width:11px;height:11px;background:#27a6ba;border:2px solid white;border-radius:50%;box-shadow:0 0 0 1px #cee6ef}.heat{display:flex;gap:4px;align-items:center}.heat span{display:inline-block;width:19px;height:19px;border-radius:4px}.score{font-size:12px;font-weight:800;color:#4b6079}.alert{border-left:3px solid var(--amber);padding:10px 15px;background:#fff7ea;margin:10px 0}.insight{border:1px solid #d9e9f8;border-radius:11px;padding:13px;margin-bottom:12px;background:#fafcff}.strong{font-weight:800}.chartlegend{font-size:11px;color:var(--muted)}.foot{margin:35px 0 10px;color:#8c9bad;font-size:11px}.spark{font-size:23px}.rowbuttons{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.redact{background:#f7f8fa;border-radius:10px;padding:22px;color:#637387}.fullwidth{grid-column:1/-1}@media(max-width:1020px){.cols4{grid-template-columns:repeat(2,1fr)}.cols3{grid-template-columns:repeat(2,1fr)}aside{width:195px}main{padding:22px}}@media(max-width:690px){header{flex-wrap:wrap;padding:15px}.topright{width:100%}.topright select{max-width:none;flex:1}.frame{display:block}aside{width:100%;display:flex;overflow-x:auto;padding:8px;gap:3px}aside .group{display:none}aside button{white-space:nowrap;width:auto;flex-shrink:0;padding:10px}main{padding:19px 13px}.cols4,.cols3,.cols2,.formgrid{grid-template-columns:1fr}.tophead{align-items:flex-start;flex-direction:column}h1{font-size:24px}}
</style></head><body><header><div class="brand"><div class="mark">U</div><div><strong>UNITEN · ULDIS</strong><small>Leadership Development Intelligence System</small></div></div><div class="topright"><small style="color:#b8d3eb">DEMONSTRATION</small><select id="persona" aria-label="Select demonstration user"></select><select id="access" aria-label="Access role"><option value="leader">My view</option><option value="manager">Supervisor</option><option value="hr">Talent / HR</option><option value="executive">Executive</option></select></div></header><div class="frame"><aside id="nav"></aside><main id="app"></main></div>
<script>
const domains=['Strategic & Futures Thinking','Execution & Results','People & Talent','Change & Innovation','Academic & Enterprise Stewardship','Influence & Stakeholder Engagement','Responsible & Sustainable Leadership','Personal Leadership & Learning Agility'];
const targets={emerging:[2,2,2,2,2,2,2,2],hod:[3,3,3,3,3,3,3,3],dean:[4,4,4,4,4,4,4,4],executive:[4,4,4,4,4,4,4,4]};
const samples=[{id:'L001',name:'Dr Aina Rahman',role:'Head of Department',unit:'College of Engineering',tier:'hod',scores:[2.2,3.2,2.1,2.4,3.0,2.6,3.0,3.4],aspiration:'Deputy Dean',potential:'Developing',readiness:'Ready in 1–2 Years'},{id:'L002',name:'Assoc Prof Daniel Lim',role:'Dean',unit:'College of Computing',tier:'dean',scores:[3.8,3.7,3.3,3.1,4.0,3.4,3.5,3.8],aspiration:'Enterprise leadership',potential:'High',readiness:'Ready in 1–2 Years'},{id:'L003',name:'Dr Nurul Huda',role:'Senior Lecturer · Emerging Leader',unit:'College of Business',tier:'emerging',scores:[2.4,2.5,2.7,3.1,2.1,2.8,3.0,3.5],aspiration:'Head of Department',potential:'High',readiness:'Ready in 3–5 Years'},{id:'L004',name:'Prof Farid Ismail',role:'Enterprise Leader',unit:'University Leadership',tier:'executive',scores:[4,4,3.8,3.9,4,3.7,3.9,4],aspiration:'Enterprise stewardship',potential:'High',readiness:'Ready Now'}];
const seed=[{id:101,person:'L001',name:'Digital Transformation Leadership Lab',type:'Simulation',date:'2026-08-14',hours:6,domain:3,status:'Validated',evidence:'Decision memo and faculty digital adoption plan',impact:'Pilot adopted across two programmes',level:3},{id:102,person:'L001',name:'Leading cross-college curriculum redesign',type:'Stretch assignment',date:'2026-09-24',hours:18,domain:1,status:'Pending validation',evidence:'Project roadmap and consultation outputs',impact:'',level:3},{id:103,person:'L002',name:'Institutional strategic foresight retreat',type:'Action learning',date:'2026-08-22',hours:12,domain:0,status:'Validated',evidence:'Three future scenarios and strategy brief',impact:'Scenario recommendations incorporated into planning',level:4},{id:104,person:'L003',name:'AI-enabled teaching innovation',type:'Project',date:'2026-07-11',hours:20,domain:3,status:'Validated',evidence:'Implementation portfolio',impact:'Positive pilot review',level:2},{id:105,person:'L001',name:'Mentoring junior academics',type:'Mentoring',date:'2026-10-02',hours:8,domain:2,status:'Pending validation',evidence:'Mentoring plan and reflection',impact:'',level:2}];
const interventions=[{domain:0,title:'Strategy-to-execution challenge',kind:'Action-learning project',time:'8–12 weeks',description:'Lead a futures-focused initiative, test assumptions and present options to an executive sponsor.'},{domain:1,title:'90-day delivery sprint',kind:'Stretch assignment',time:'12 weeks',description:'Own a measurable cross-functional improvement with milestones and independent outcome review.'},{domain:2,title:'Coach and develop emerging leaders',kind:'Mentoring + observation',time:'12 weeks',description:'Mentor two emerging academics with observed conversations and co-developed growth plans.'},{domain:3,title:'Digital transformation failure lab',kind:'Simulation + pilot',time:'6–8 weeks',description:'Diagnose a failed adoption scenario, then implement a measured change pilot.'},{domain:4,title:'Academic enterprise resource trade-off',kind:'Decision lab',time:'4 weeks',description:'Defend an academic quality and resource allocation decision using institutional constraints.'},{domain:5,title:'Stakeholder coalition assignment',kind:'Applied leadership',time:'8 weeks',description:'Build and document alignment with internal and external stakeholders on a contested priority.'},{domain:6,title:'SDG/ESG leadership decision lab',kind:'Scenario + applied project',time:'6 weeks',description:'Make and defend a sustainability decision with measurable organisational indicators.'},{domain:7,title:'Reflective leadership practice',kind:'Coaching + fieldwork',time:'10 weeks',description:'Complete coaching cycles, collect observed feedback and document changed leadership behaviour.'}];
const $=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let records=JSON.parse(localStorage.getItem('uldis_records')||'null')||seed;let plans=JSON.parse(localStorage.getItem('uldis_plans')||'null')||[];let person=localStorage.getItem('uldis_person')||'L001';let access='leader',view='overview',filter='all';function save(){localStorage.setItem('uldis_records',JSON.stringify(records));localStorage.setItem('uldis_plans',JSON.stringify(plans));localStorage.setItem('uldis_person',person)}function me(){return samples.find(p=>p.id===person)}function own(){return records.filter(r=>r.person===person)}function gap(p,i){return Math.max(0,targets[p.tier][i]-p.scores[i])}function gaps(p){return domains.map((_,i)=>({i,g:gap(p,i)})).sort((a,b)=>b.g-a.g)}function avg(a){return a.reduce((s,x)=>s+x,0)/Math.max(a.length,1)}function progress(a,b,max=4){return `<div class="bar"><div class="fill" style="width:${Math.min(100,Math.max(0,a/max*100))}%"></div></div>`}function badge(s){return `<span class="pill ${s==='Validated'?'ok':s.includes('Ready')?'ok':'risk'}">${esc(s)}</span>`}function btn(txt,fn,style=''){return `<button class="btn ${style}" onclick="${fn}">${txt}</button>`}function panel(title,content,extra=''){return `<section class="card ${extra}"><h2>${title}</h2>${content}</section>`}function heading(title,sub,actions=''){return `<div class="tophead"><div><div class="eyebrow">UNITEN / LEADERSHIP INTELLIGENCE</div><h1>${title}</h1><p class="sub">${sub}</p></div><div class="flex">${actions}</div></div>`}function scoreLabel(s){return s>=3.6?'Strong evidence':s>=2.6?'Developing capability':s>=1.6?'Foundational':'Evidence required'}function scorecard(t,v,note,color=''){return `<div class="card"><div class="muted" style="font-size:12px;font-weight:700">${t}</div><div class="metric ${color}">${v}</div><div class="tiny">${note}</div></div>`}function bars(p){return domains.map((d,i)=>`<div class="barrow"><div class="between"><span>${d}</span><span class="score">${p.scores[i].toFixed(1)} / ${targets[p.tier][i]}</span></div>${progress(p.scores[i])}</div>`).join('')}function recordTable(rows,admin=false){return `<div class="tablewrap"><table><thead><tr><th>Learning experience</th><th>Type / Date</th><th>Competency</th><th>Hours</th><th>Evidence</th><th>Status</th>${admin?'<th>Review</th>':''}</tr></thead><tbody>${rows.map(r=>`<tr><td><strong>${esc(r.name)}</strong>${r.impact?`<br><span class="tiny">Outcome: ${esc(r.impact)}</span>`:''}</td><td>${esc(r.type)}<br><span class="tiny">${r.date}</span></td><td>${esc(domains[r.domain])}</td><td>${r.hours}</td><td>${esc(r.evidence)}</td><td>${badge(r.status)}</td>${admin?`<td>${r.status!=='Validated'?btn('Validate',`validate(${r.id})`,'secondary small'):'✓'}</td>`:''}</tr>`).join('')||'<tr><td colspan="7">No entries yet</td></tr>'}</tbody></table></div>`}
function renderOverview(){const p=me(),r=own(),validated=r.filter(x=>x.status==='Validated'),big=gaps(p).slice(0,3);return heading('Leadership Intelligence Dashboard',`Welcome, ${p.name}. Your capability, evidence and development priorities.`,btn('+ Log CPD',"go('add')"))+`<div class="grid cols4">${scorecard('CPD hours',r.reduce((s,x)=>s+x.hours,0),'All recorded experiences')}${scorecard('Validated evidence',validated.length,'Evidence-reviewed activities')}${scorecard('Capability index',avg(p.scores).toFixed(2)+' / 4','Illustrative assessed baseline')}${scorecard('Priority gaps',gaps(p).filter(g=>g.g>=.6).length,'Domains below role target','warn')}</div><div class="space"></div><div class="grid cols2">${panel('My competency profile',bars(p)+btn('Full competency analysis',"go('capability')",'secondary small'))}${panel('Priority development opportunities',big.map(g=>`<div class="insight"><div class="between"><strong>${domains[g.i]}</strong><span class="pill risk">Gap ${g.g.toFixed(1)}</span></div><p class="muted">${interventions[g.i].description}</p>${btn('Build action plan',`addPlan(${g.i})`,'secondary small')}</div>`).join(''))}</div><div class="space"></div><div class="grid cols2">${panel('Recent learning and evidence',recordTable(r.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,3)))}${panel('Leadership Passport snapshot',`<div class="flex"><div class="round">${p.name.split(' ').slice(-2).map(s=>s[0]).join('')}</div><div><strong>${p.name}</strong><div class="role">${p.role} · ${p.unit}</div></div></div><p>Leadership aspiration <strong>${p.aspiration}</strong></p><p>Development plan actions <strong>${plans.filter(x=>x.person===p.id).length}</strong></p><p>Validated experiential records <strong>${validated.length}</strong></p><div class="notice">Succession assessments are confidential. Demonstration readiness labels are illustrative and never inferred solely from CPD points.</div>${btn('Open Leadership Passport',"go('passport')",'secondary small')}`)}</div>`}
function renderPassport(){const p=me();return heading('Leadership Passport','A portable evidence-based record of leadership growth.',btn('Export passport',"exportPassport()",'secondary'))+`<div class="grid cols3">${panel('Leader profile',`<div class="round">${p.name.substring(0,1)}</div><h3 style="margin-top:14px">${p.name}</h3><p class="role">${p.role}<br>${p.unit}</p><div class="tag">${p.tier.toUpperCase()}</div><p>Next aspiration <strong>${p.aspiration}</strong></p>`)}${panel('Competency strengths',domains.map((d,i)=>({d,s:p.scores[i]})).sort((a,b)=>b.s-a.s).slice(0,3).map(x=>`<div class="barrow"><div class="between"><span>${x.d}</span><b>${x.s.toFixed(1)}</b></div>${progress(x.s)}</div>`).join(''))}${panel('Growth priorities',gaps(p).slice(0,3).map(g=>`<div class="barrow"><b>${domains[g.i]}</b><div class="tiny">Target ${targets[p.tier][g.i]} | Baseline ${p.scores[g.i].toFixed(1)} | Gap ${g.g.toFixed(1)}</div></div>`).join(''))}</div><div class="space"></div>${panel('Evidence portfolio and development timeline',`<div class="timeline">${own().slice().sort((a,b)=>b.date.localeCompare(a.date)).map(r=>`<div class="event"><strong>${esc(r.name)}</strong> ${badge(r.status)}<div class="tiny">${r.date} · ${domains[r.domain]}</div><div class="muted">${esc(r.evidence)}</div>${r.impact?`<div class="good">Documented outcome: ${esc(r.impact)}</div>`:''}</div>`).join('')}</div><div class="notice">A documented activity is not automatically evidence of advanced proficiency. Validation considers authenticity, behaviour, sustained application and impact.</div>`)}`}
function renderLog(){return heading('CPD & Experience Register','Record formal learning and leadership experiences with supporting evidence.',btn('+ New CPD entry',"go('add')"))+`<div class="grid cols4">${scorecard('Recorded activities',own().length,'All activity types')}${scorecard('CPD hours',own().reduce((a,r)=>a+r.hours,0),'Administrative measure')}${scorecard('Evidence reviewed',own().filter(r=>r.status==='Validated').length,'Assessed records')}${scorecard('Awaiting review',own().filter(r=>r.status!=='Validated').length,'Supervisor validation queue')}</div><div class="space"></div>${panel('My learning history',recordTable(own().slice().sort((a,b)=>b.date.localeCompare(a.date))))}<div class="notice">Accepted CPD includes formal courses, coaching, mentoring, simulations, reflective professional reading, committee leadership, project work, cross-functional responsibilities and stretch assignments. Activities count as hours; proficiency is assessed separately.</div>`}
function renderAdd(){return heading('Record CPD activity','Link experience to the framework and provide evidence of application.')+`<div class="card"><form id="addform" onsubmit="submitRecord(event)"><div class="formgrid"><div class="field full"><label>Activity / experience</label><input name="name" required placeholder="e.g. Leading an institutional curriculum initiative"></div><div class="field"><label>Activity type</label><select name="type">${['Workshop','Course','Action learning','Stretch assignment','Project','Mentoring','Coaching','Simulation','Professional reading','Conference','Cross-functional assignment','Committee leadership','Other'].map(s=>`<option>${s}</option>`).join('')}</select></div><div class="field"><label>Date completed</label><input name="date" type="date" required value="2026-10-26"></div><div class="field"><label>Hours</label><input name="hours" type="number" min="0.5" step="0.5" max="1000" required value="4"></div><div class="field"><label>Competency mapping (suggested automatically; editable)</label><select name="domain" id="mappedDomain">${domains.map((d,i)=>`<option value="${i}">${d}</option>`).join('')}</select></div><div class="field full"><label>Evidence / artefact / link or description</label><textarea name="evidence" required placeholder="Describe what you created or link to a non-sensitive institutional artefact"></textarea></div><div class="field full"><label>Application / outcome / measurable impact</label><textarea name="impact" placeholder="What changed as a result? Give indicators where possible."></textarea></div><div class="field"><label>Claimed evidence depth</label><select name="level"><option value="1">Participation / exposure</option><option value="2">Applied in practice</option><option value="3" selected>Demonstrated result</option><option value="4">Sustained organisational impact</option></select></div><div class="field"><label>AI-assisted mapping rationale</label><div id="mapwhy" class="detail tiny">Enter the activity title to view a suggested domain.</div></div><div class="field full"><div class="notice">New records enter supervisor validation. Hours and competency scores are not automatically increased.</div><button class="btn" type="submit">Save CPD record</button></div></div></form></div>`}
function renderCapability(){const p=me();return heading('Capability & Gap Analysis','Evidence-informed baseline compared with current role requirements.')+`<div class="grid cols2">${panel('Capability vs role expectations',bars(p))}${panel('Prioritised gap diagnosis',gaps(p).map(g=>`<div class="barrow"><div class="between"><strong>${domains[g.i]}</strong><span class="pill ${g.g>=.7?'risk':'ok'}">Gap ${g.g.toFixed(1)}</span></div><div class="tiny">${scoreLabel(p.scores[g.i])}. ${g.g>=.7?'Priority intervention indicated.':'Maintain or enrich with new challenge.'}</div>${progress(p.scores[g.i])}</div>`).join(''))}</div><div class="space"></div>${panel('Illustrative assessment methodology',`<div class="grid cols3"><div><h3>1 · Evidence quality</h3><p class="muted">Identify source, currency, authenticity, relevance to behavioural indicators and strength of observable impact.</p></div><div><h3>2 · Multi-source triangulation</h3><p class="muted">Combine self-reflection, supervisor assessment, 360 feedback and reviewed work products. Display disagreement rather than hiding it.</p></div><div><h3>3 · Calibrated judgement</h3><p class="muted">Human assessors validate proficiency. The system suggests gaps, not promotion decisions, from the supported evidence.</p></div></div><div class="notice">Prototype scores are synthetic assessment baselines for demonstration. Adding an activity never silently increases these scores.</div>`)}`}
function renderPlan(){const p=me(),items=plans.filter(x=>x.person===person),prior=gaps(p).slice(0,4);const summary=`<div class="grid cols3">${scorecard('Development actions',items.length,'Current personalised plan')}${scorecard('Completed actions',items.filter(x=>x.done).length,'Reported progress')}${scorecard('Priority domains',prior.length,'Based on role-specific gaps')}</div><div class="space"></div>`;const actions=items.length?items.map(a=>`<div class="insight between"><div><strong>${esc(a.title)}</strong><div class="tiny">${esc(domains[a.domain])} · ${esc(a.kind)} · ${esc(a.time)}</div><p class="muted">${esc(a.description)}</p><span class="pill">${a.done?'Completed · pending impact review':'Planned / in progress'}</span></div>${btn(a.done?'Reopen':'Mark done',`togglePlan(${plans.indexOf(a)})`,'secondary small')}</div>`).join(''):'<div class="empty">No plan actions yet. Select Suggest priority actions to create a personal plan.</div>';return heading('My 12-Month Leadership Growth Plan','Specific experiences, checkpoints and measurable application, agreed with a supervisor.',btn('Suggest priority actions',"suggestPlans()"))+summary+panel('My development commitments',actions+btn('Add from priority gap',`addPlan(${prior[0].i})`,'secondary small')+'<div class="notice">Each action needs an accountable owner, evidence and review date in the production version.</div>');}
function renderCoach(){const p=me(),prior=gaps(p).slice(0,3);return heading('AI Leadership Development Coach','Context-aware recommendations grounded in demonstrated gaps and future roles.')+`<div class="grid cols2">${panel('Your personalised development brief',`<div class="flex"><span class="spark">✦</span><strong>Development intelligence for ${p.name}</strong></div><p>Your current role is <b>${p.role}</b>. Your future-role interest is <b>${p.aspiration}</b>. The strongest opportunities to develop are:</p>${prior.map(g=>`<div class="insight"><strong>${domains[g.i]}</strong> <span class="pill risk">${g.g.toFixed(1)} below target</span><p class="muted">${interventions[g.i].description}</p><div class="tiny">Recommended format: ${interventions[g.i].kind} · ${interventions[g.i].time}</div>${btn('Include in development plan',`addPlan(${g.i})`,'secondary small')}</div>`).join('')}`)}${panel('Ask the development coach',`<p class="muted">Explore what to practise, how to demonstrate impact, or how to prepare for your next leadership role.</p><div class="field"><label>Your question</label><textarea id="coachQuestion" placeholder="How can I strengthen my strategic thinking through a real UNITEN project?"></textarea></div><div class="rowbuttons">${btn('Generate guidance',"coachAnswer()")}${btn('How do I prove impact?',"coachPreset('How do I prove impact?')",'secondary small')}${btn('Prepare for next role',"coachPreset('How do I prepare for my next role?')",'secondary small')}</div><div id="coachResult" class="detail" style="margin-top:15px"><span class="muted">The demonstration coach uses transparent local recommendations. It is not connected to a live AI model.</span></div>`)} </div><div class="notice">Production AI will require secure model integration, retrieval from approved UNITEN materials, evidence citations, human review, bias monitoring, explainable recommendations and policies preventing automated high-stakes talent judgements.</div>`}
function renderInstitution(){const all=samples,weak=domains.map((d,i)=>({d,i,mean:avg(all.map(p=>p.scores[i])),demand:avg(all.map(p=>targets[p.tier][i]))})).sort((a,b)=>(b.demand-b.mean)-(a.demand-a.mean));return heading('Institutional Capability Intelligence','Synthetic data showing the portfolio view across leadership levels.',btn('Export summary',"exportSummary()",'secondary'))+`<div class="grid cols4">${scorecard('Leaders in demo',all.length,'All four illustrative personas')}${scorecard('CPD events',records.length,'Institutional register')}${scorecard('Evidence validated',records.filter(r=>r.status==='Validated').length,'Quality-assured examples')}${scorecard('Capability index',avg(all.flatMap(p=>p.scores)).toFixed(2),'Mean demonstration score / 4')}</div><div class="space"></div><div class="grid cols2">${panel('Capability supply vs role demand',weak.map(g=>`<div class="barrow"><div class="between"><span>${g.d}</span><span class="score">${g.mean.toFixed(2)} / ${g.demand.toFixed(2)}</span></div>${progress(g.mean)}</div>`).join(''))}${panel('Strategic interventions to prioritise',weak.slice(0,4).map((g,n)=>`<div class="insight"><strong>${n+1}. ${g.d}</strong><div class="tiny">Institutional mean capability gap ${(g.demand-g.mean).toFixed(2)}</div><p class="muted">${interventions[g.i].description}</p></div>`).join(''))}</div><div class="space"></div>${panel('Leadership pipeline by unit',`<div class="tablewrap"><table><thead><tr><th>Unit</th><th>Leadership role</th><th>Capability index</th><th>Top gap</th><th>Succession signal</th></tr></thead><tbody>${samples.map(p=>`<tr><td>${p.unit}</td><td>${p.role}</td><td>${avg(p.scores).toFixed(2)} / 4</td><td>${domains[gaps(p)[0].i]}</td><td>${badge(p.readiness)}</td></tr>`).join('')}</tbody></table></div><div class="notice">These are invented demonstration personas and scores, not findings about real UNITEN employees or colleges. Group reports in production must enforce cohort-size thresholds and role-based access.</div>`)}`}
function renderSuccession(){const priv=access==='hr'||access==='executive';return heading('Leadership Pipeline & Succession','Governed talent-review workspace. Not an automated promotion ranking.')+(!priv?`<div class="card"><div class="redact"><h2>Restricted leadership talent information</h2><p>Detailed potential assessments, readiness categories and successor discussions are accessible only to authorised talent and executive roles. Choose an authorised demonstration role above to explore this view.</p></div></div>`:`<div class="grid cols4">${['Ready Now','Ready in 1–2 Years','Ready in 3–5 Years','High Potential/Further Experience Required'].map(l=>scorecard(l,samples.filter(p=>p.readiness===l).length,'Illustrative review labels')).join('')}</div><div class="space"></div>${panel('Confidential talent review',`<div class="tablewrap"><table><thead><tr><th>Leader</th><th>Current role</th><th>Aspiration</th><th>Development opportunity</th><th>Illustrative readiness</th></tr></thead><tbody>${samples.map(p=>`<tr><td><strong>${p.name}</strong></td><td>${p.role}</td><td>${p.aspiration}</td><td>${domains[gaps(p)[0].i]}</td><td>${badge(p.readiness)}</td></tr>`).join('')}</tbody></table></div><div class="notice">Succession readiness must be determined by a documented human talent committee reviewing competency evidence, role experience, aspiration, performance and contextual opportunity. It must never be computed solely from CPD hours, activity counts or a single AI score.</div>`)}`)}
function renderValidation(){if(access!=='manager'&&access!=='hr'&&access!=='executive')return heading('Evidence Review','Available to authorised supervisors and talent managers.')+'<div class="card redact">Switch to Supervisor or Talent / HR demonstration access to review evidence.</div>';const r=records.filter(r=>r.status!=='Validated');return heading('Evidence Review Queue','Supervisor confirmation of authenticity, application and results.')+panel('Records awaiting review',recordTable(r,true)+`<div class="notice">Validation confirms evidence receipt and credibility, not automatic competency-stage advancement. Advanced evidence still requires assessment and moderation.</div>`)}
function renderReports(){return heading('Reports & Data Exports','Operational intelligence and audit-ready exports.',btn('Export CPD CSV',"exportCSV()"))+`<div class="grid cols3">${panel('CPD operations',`<p>Activities <strong>${records.length}</strong></p><p>Total hours <strong>${records.reduce((a,r)=>a+r.hours,0)}</strong></p><p>Pending validation <strong>${records.filter(r=>r.status!=='Validated').length}</strong></p>${btn('Download register',"exportCSV()",'secondary small')}`)}${panel('Development effectiveness',`<p>Completed plan actions <strong>${plans.filter(a=>a.done).length}</strong></p><p>Validated applied evidence <strong>${records.filter(r=>r.status==='Validated'&&r.impact).length}</strong></p><p class="tiny">Do not interpret these as causal impact without follow-up evaluation.</p>${btn('Download analytics',"exportSummary()",'secondary small')}`)}${panel('Leadership supply and demand',`<p>Priority capability: <strong>${domains[0]}</strong> (illustrative)</p><p>Pipeline leaders <strong>${samples.length}</strong></p><p class="tiny">Use workforce scenarios and configurable future demand targets.</p>${btn('Institutional dashboard',"go('institution')",'secondary small')}`)}</div><div class="space"></div>${panel('Recommended scheduled reporting',`<div class="grid cols2"><div><h3>Monthly</h3><p>Activity and evidence quality, overdue developmental commitments, supervisor validation backlog, participation and inclusion checks.</p></div><div><h3>Quarterly</h3><p>Capability progress, priority skill gaps, intervention completion and transfer, pipeline exposure, emerging systemic risks.</p></div><div><h3>Annually</h3><p>Strategic capability supply-demand forecast, succession bench strength, investments versus documented outcomes, governance audit.</p></div><div><h3>On demand</h3><p>Role, unit, domain and intervention comparisons with appropriate suppression for small cohorts and confidential data.</p></div></div>`)}`}
function renderSettings(){return heading('Architecture & Governance','How the prototype scales into UNITEN’s institutional CPD ecosystem.')+`<div class="grid cols2">${panel('Data and integration layers',`<p><b>Identity</b> · Staff ID, secure authentication, organisational hierarchy</p><p><b>HR</b> · Position history, appraisals, career pathway</p><p><b>LMS / training</b> · Course enrolment, completion, verified CPD hours</p><p><b>Evidence</b> · Secure document vault, project artefacts, outcomes</p><p><b>Capabilities</b> · Versioned rubric, role requirements, calibrated review</p><p><b>Talent</b> · Access-controlled pipeline, committee judgements</p><p><b>AI</b> · Approved content retrieval, guidance audit log, human approval</p>`)}${panel('Safeguards built into the design',`<p>✓ Leader controls self-visible development profile</p><p>✓ Restricted successor readiness and potential</p><p>✓ Audit trail for record and assessment changes</p><p>✓ Distinct CPD hours, evidence status and proficiency</p><p>✓ Explainable gap scoring and configurable targets</p><p>✓ AI cannot make appointment or promotion decisions</p><p>✓ Data minimisation, retention and secure hosting required</p>`)} </div><div class="space"></div>${panel('Prototype limitations',`<p>This is a <strong>standalone simulated demonstration</strong>. All sample names, scores, role targets and readiness classifications are invented, stored only in this browser when modified. AI guidance is a local rules-based mock-up. There is no login security, server database, 360 assessment integration, file-upload service or live AI API.</p><div class="rowbuttons">${btn('Reset demonstration data',"resetData()",'secondary')}${btn('Download records',"exportCSV()",'ghost')}</div>`)}`}
function go(v){view=v;render();window.scrollTo({top:0,behavior:'smooth'})}function render(){const p=me();$('#persona').value=person;$('#access').value=access;$('#nav').innerHTML=`<div class="group">MY LEADERSHIP</div>${[['overview','◫','Overview'],['passport','♙','Leadership Passport'],['log','▤','CPD Register'],['capability','◈','Capability & Gaps'],['plan','◷','Development Plan'],['coach','✦','AI Development Coach']].map(i=>`<button class="${view===i[0]?'active':''}" onclick="go('${i[0]}')"><span>${i[1]}</span>${i[2]}</button>`).join('')}<div class="group">ORGANISATIONAL INTELLIGENCE</div>${[['institution','▦','Institutional Analytics'],['succession','♧','Succession Pipeline'],['validation','✓','Evidence Review'],['reports','▣','Reports & Exports'],['settings','⚙','Governance & Systems']].map(i=>`<button class="${view===i[0]?'active':''}" onclick="go('${i[0]}')"><span>${i[1]}</span>${i[2]}</button>`).join('')}`;const pages={overview:renderOverview,passport:renderPassport,log:renderLog,add:renderAdd,capability:renderCapability,plan:renderPlan,coach:renderCoach,institution:renderInstitution,succession:renderSuccession,validation:renderValidation,reports:renderReports,settings:renderSettings};$('#app').innerHTML=(pages[view]||renderOverview)()+`<div class="foot">ULDIS conceptual prototype · Synthetic demonstration data · Version 1.0 · Not for real personnel decisions</div>`;if(view==='add'){const field=$('#addform [name=name]');field.addEventListener('input',()=>{let v=field.value.toLowerCase(),terms=[['strateg','future','scenario','vision'],['project','deliver','performance','implement'],['mentor','coach','people','team'],['digital','ai','innov','change','transform'],['budget','finance','academic','curriculum','resource'],['partner','stakeholder','industry','engagement'],['sustain','sdg','esg','ethic'],['reflect','resilience','learning','self']];let best=0,n=-1;terms.forEach((t,i)=>{const count=t.filter(x=>v.includes(x)).length;if(count>n){best=i;n=count}});if(n>0){$('#mappedDomain').value=best;$('#mapwhy').textContent='Suggested: '+domains[best]+' based on activity keywords. You can override it.'}else $('#mapwhy').textContent='Enter a descriptive activity title to suggest a domain.'})}}function submitRecord(e){e.preventDefault();const f=new FormData(e.target);records.unshift({id:Date.now(),person,name:String(f.get('name')).trim(),type:String(f.get('type')),date:String(f.get('date')),hours:Number(f.get('hours')),domain:Number(f.get('domain')),status:'Pending validation',evidence:String(f.get('evidence')).trim(),impact:String(f.get('impact')).trim(),level:Number(f.get('level'))});save();alert('Activity recorded and submitted for evidence review. Proficiency remains unchanged.');go('log')}function validate(id){if(access==='leader')return;let r=records.find(x=>x.id===id);if(!r)return;r.status='Validated';save();render()}function addPlan(i){let a=interventions[i];if(plans.some(x=>x.person===person&&x.domain===i)){alert('An action for this domain is already in the plan.');return}plans.push({...a,person,done:false});save();go('plan')}function suggestPlans(){for(const g of gaps(me()).slice(0,3)){const a=interventions[g.i];if(!plans.some(x=>x.person===person&&x.domain===g.i))plans.push({...a,person,done:false})}save();render()}function togglePlan(index){plans[index].done=!plans[index].done;save();render()}function coachPreset(s){$('#coachQuestion').value=s;coachAnswer()}function coachAnswer(){const q=$('#coachQuestion').value.trim().toLowerCase(),p=me(),g=gaps(p)[0],d=domains[g.i],action=interventions[g.i];let ans;if(/impact|evidence|prove|measure|demonstrat/.test(q))ans=`For ${d}, agree a baseline, retain the original decision and supporting artefact, document what you personally did, collect observations from relevant stakeholders, and compare an outcome indicator before and after implementation. Seek supervisor verification. Participation alone does not establish improved capability.`;else if(/next role|succession|promot|prepare|career/.test(q))ans=`Your stated aspiration is ${p.aspiration}. Discuss its role expectations with your supervisor, secure a cross-functional stretch assignment, and document impact beyond your current unit. Your first candidate intervention is ${action.title}. A talent panel, not the AI coach, determines succession readiness.`;else ans=`Prioritise ${d}, where your illustrative baseline is ${p.scores[g.i].toFixed(1)} against a role expectation of ${targets[p.tier][g.i]}. Try ${action.title} (${action.time}). Create an evidence plan before starting and agree indicators with your supervisor. Reflection, observable practice and assessed outcomes are stronger than attendance alone.`;$('#coachResult').innerHTML=`<strong>Coach guidance</strong><p>${esc(ans)}</p><div class="tiny">Prototype rules-based suggestion · Not live AI · Check contextual relevance with your supervisor</div>`}function download(filename,data,type){const u=URL.createObjectURL(new Blob([data],{type}));const a=document.createElement('a');a.href=u;a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(u),500)}function csv(rows){return rows.map(r=>r.map(c=>'"'+String(c??'').replace(/"/g,'""')+'"').join(',')).join('\r\n')}function exportCSV(){download('ULDIS_CPD_Register.csv',csv([['ID','Person ID','Leader','Activity','Type','Date','Hours','Competency','Evidence','Impact','Validation'],...records.map(r=>[r.id,r.person,samples.find(p=>p.id===r.person)?.name,r.name,r.type,r.date,r.hours,domains[r.domain],r.evidence,r.impact,r.status])]),'text/csv;charset=utf-8')}function exportSummary(){download('ULDIS_institutional_summary.csv',csv([['Leader','Role','Unit','Mean competency','Priority gap','Recorded CPD hours'],...samples.map(p=>[p.name,p.role,p.unit,avg(p.scores).toFixed(2),domains[gaps(p)[0].i],records.filter(r=>r.person===p.id).reduce((a,r)=>a+r.hours,0)])]),'text/csv;charset=utf-8')}function exportPassport(){const p=me();download('ULDIS_Leadership_Passport_'+p.id+'.json',JSON.stringify({profile:p,competencyDomains:domains,targets:targets[p.tier],activities:own(),developmentPlan:plans.filter(x=>x.person===person),notice:'Synthetic demo data; scores not validated'},null,2),'application/json')}function resetData(){if(!confirm('Reset local demonstration activities and development plans?'))return;records=JSON.parse(JSON.stringify(seed));plans=[];save();render()}$('#persona').innerHTML=samples.map(p=>`<option value="${p.id}">${p.name} · ${p.role}</option>`).join('');$('#persona').addEventListener('change',e=>{person=e.target.value;save();render()});$('#access').addEventListener('change',e=>{access=e.target.value;render()});render();
</script></body></html>
